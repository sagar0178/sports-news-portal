name: Publish sports news

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-sports-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and publish news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autonews.py

      - name: Commit generated posts and history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "published_history.json" ]; then
            git add -- published_history.json
          fi

          if [ -d "_posts" ]; then
            git add -- "_posts"
          fi

          if git diff --cached --quiet; then
            echo "No new posts or history changes to commit."
            exit 0
          fi

          git commit -m "chore: publish latest sports news"
          git push origin "HEAD:${GITHUB_REF_NAME}"
