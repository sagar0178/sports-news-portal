name: Publish sports news

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autonews.py

      - name: Commit and Push
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "published_history.json" ]; then
            git add -- published_history.json
          fi

          if [ -d "_posts" ]; then
            git add -- "_posts"
          fi

          if git diff --cached --quiet; then
            echo "No new posts or history changes to commit."
            exit 0
          fi

          git commit -m "Auto-published latest sports news"
          git push origin "HEAD:${GITHUB_REF_NAME}"
